<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Master Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .editable-cell:focus { background-color: #fef9c3; outline: 2px solid #3b82f6; border-radius: 4px; padding: 2px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-7xl mx-auto">
        <div class="bg-white rounded-2xl shadow-md p-6 mb-6 border border-slate-200">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-3xl font-black text-slate-800 tracking-tight">SKU MASTER 2026</h1>
                    <p class="text-slate-500 font-medium">Folder-based data extraction with live editing</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <label class="block text-[10px] uppercase font-bold text-slate-400">Workbook Name</label>
                        <input type="text" id="yearName" value="Inventory_Report_2026" class="border-b-2 border-slate-200 focus:border-blue-500 outline-none font-bold text-slate-700 px-1 text-right">
                    </div>
                    <button onclick="processAndDownload()" id="exportBtn" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-blue-200 transition-all flex items-center gap-2">
                        <span>📥</span> Export Excel
                    </button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="md:col-span-2 relative">
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search by SKU, Month, or Subfolder..." class="w-full pl-12 pr-4 py-4 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-400 outline-none text-slate-700" disabled>
                <span class="absolute left-4 top-4 text-slate-400 text-xl">🔍</span>
            </div>
            <div class="relative group">
                <input type="file" id="fileInput" webkitdirectory mozdirectory directory multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                <div class="bg-white py-4 px-6 rounded-2xl shadow-sm text-center border-2 border-dashed border-slate-300 group-hover:border-blue-400 group-hover:bg-blue-50 transition-all">
                    <span class="text-blue-600 font-bold">📁 Click to Load Folders</span>
                </div>
            </div>
        </div>

        <div id="previewCard" class="hidden bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto max-h-[70vh]">
                <table class="w-full text-left border-collapse" id="skuTable">
                    <thead class="bg-slate-800 text-slate-100 sticky top-0 z-20">
                        <tr>
                            <th class="p-4 text-xs uppercase tracking-wider font-bold">Month</th>
                            <th class="p-4 text-xs uppercase tracking-wider font-bold">Subfolder (Location)</th>
                            <th class="p-4 text-xs uppercase tracking-wider font-bold">SKU Number</th>
                            <th class="p-4 text-xs uppercase tracking-wider font-bold text-blue-300">QTY (Editable)</th>
                            <th class="p-4 text-xs uppercase tracking-wider font-bold">Filename</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let rawData = [];
        const fileInput = document.getElementById('fileInput');
        const tableBody = document.getElementById('tableBody');
        const previewCard = document.getElementById('previewCard');
        const exportBtn = document.getElementById('exportBtn');
        const searchInput = document.getElementById('searchInput');

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).filter(f => f.name.endsWith('.txt'));
            if (files.length === 0) return;

            rawData = [];
            const monthMap = {"01":"JAN","02":"FEB","03":"MAR","04":"APR","05":"MAY","06":"JUN","07":"JUL","08":"AUG","09":"SEP","10":"OCT","11":"NOV","12":"DEC"};

            for (let file of files) {
                const text = await file.text();
                const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l !== "");
                
                // Extract month from filename (e.g., 16.11.2025.txt)
                const match = file.name.match(/\.(\d{1,2})\./);
                const monthName = match ? (monthMap[match[1].padStart(2, '0')] || "OTHER") : "OTHER";

                // Extract subfolder name from webkitRelativePath
                const pathParts = file.webkitRelativePath.split('/');
                // Example: "2025/NOV/Transfer Hebron/16.11.2025.txt"
                // The subfolder is usually the one right before the filename
                const subfolderName = pathParts.length > 2 ? pathParts[pathParts.length - 2] : "Main Root";

                const counts = {};
                lines.forEach(sku => { counts[sku] = (counts[sku] || 0) + 1; });

                Object.entries(counts).forEach(([sku, qty]) => {
                    rawData.push({
                        month: monthName,
                        subfolder: subfolderName,
                        sku: sku,
                        qty: qty,
                        fileName: file.name
                    });
                });
            }

            renderTable(rawData);
            previewCard.classList.remove('hidden');
            exportBtn.classList.remove('hidden');
            searchInput.disabled = false;
        });

        function renderTable(data) {
            tableBody.innerHTML = '';
            data.forEach((item, index) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-blue-50/50 transition-colors";
                row.innerHTML = `
                    <td class="p-4 text-sm font-semibold text-slate-600">${item.month}</td>
                    <td class="p-4 text-sm text-slate-500 font-medium">${item.subfolder}</td>
                    <td class="p-4 text-sm font-bold text-slate-800">${item.sku}</td>
                    <td class="p-4 text-sm">
                        <span contenteditable="true" onblur="updateQty(${index}, this.innerText)" class="editable-cell text-blue-600 font-black cursor-edit">${item.qty}</span>
                    </td>
                    <td class="p-4 text-[10px] text-slate-400 font-mono">${item.fileName}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        function updateQty(index, newVal) {
            const val = parseInt(newVal);
            if (!isNaN(val)) { rawData[index].qty = val; }
        }

        function filterTable() {
            const query = searchInput.value.toLowerCase();
            const filtered = rawData.filter(item => 
                item.sku.toLowerCase().includes(query) || 
                item.month.toLowerCase().includes(query) || 
                item.subfolder.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        function processAndDownload() {
            const wb = XLSX.utils.book_new();
            const sheets = {};
            const summary = {};

            rawData.forEach(item => {
                if (!sheets[item.month]) sheets[item.month] = [];
                sheets[item.month].push({
                    "Subfolder": item.subfolder,
                    "SKU": item.sku,
                    "QTY": item.qty,
                    "File": item.fileName
                });
                summary[item.sku] = (summary[item.sku] || 0) + item.qty;
            });

            // Monthly Sheets
            const monthOrder = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            Object.keys(sheets).sort((a,b) => monthOrder.indexOf(a) - monthOrder.indexOf(b)).forEach(m => {
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheets[m]), m);
            });

            // Summary Sheet
            const summaryData = Object.entries(summary).map(([sku, q]) => ({ "SKU": sku, "TOTAL_QTY": q }))
                                     .sort((a,b) => b.TOTAL_QTY - a.TOTAL_QTY);
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryData), "ANNUAL_SUMMARY");

            XLSX.writeFile(wb, `${document.getElementById('yearName').value}.xlsx`);
        }
    </script>
</body>
</html>
